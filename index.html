<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mes Projets</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171b20;font-family:Segoe UI,Arial,sans-serif}.app{position:relative;width:100vw;height:100vh;background:url('accueil_reference.png') center center/100% 100% no-repeat}.hot{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:2.2vw}.hot:focus-visible,.hot:hover{outline:3px solid rgba(255,255,255,.72);outline-offset:-3px;background:rgba(255,255,255,.035)}
.h-stm{left:1.8%;top:23.2%;width:18.8%;height:49.8%}.h-terrain{left:21.7%;top:23.2%;width:18.4%;height:49.8%}.h-livre{left:41.2%;top:23.2%;width:18.4%;height:49.8%}.h-piano{left:60.7%;top:23.2%;width:18.3%;height:49.8%}.h-later{left:80.1%;top:23.2%;width:18.1%;height:49.8%}.h-actions{left:1.8%;top:76%;width:35.9%;height:21.1%}.h-deadlines{left:38.6%;top:76%;width:32.2%;height:21.1%}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,13,18,.66);backdrop-filter:blur(7px);padding:2vh 2vw}.modal.on{display:flex}.sheet{width:min(860px,88vw);max-height:88vh;overflow:auto;color:#15263a;background:linear-gradient(145deg,rgba(255,255,255,.97),rgba(243,235,220,.97));border:1px solid rgba(255,255,255,.85);border-radius:24px;padding:26px 30px;box-shadow:0 20px 60px rgba(0,0,0,.4)}.head{display:flex;align-items:center;gap:14px}.head .ico{font-size:42px}.head h2{margin:0;font-size:30px}.head p{margin:3px 0 0;color:#617080}.close{margin-left:auto;border:0;background:#24384c;color:white;border-radius:999px;width:42px;height:42px;font-size:22px;cursor:pointer}.meta{display:flex;gap:14px;flex-wrap:wrap;margin:20px 0}.pill{background:#e9edf0;border-radius:999px;padding:9px 13px;font-weight:650}.progress{height:14px;background:#d8dee3;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#4fae7b;border-radius:99px}.steps{margin-top:18px}.step{display:flex;align-items:center;gap:12px;padding:12px 5px;border-bottom:1px solid #d6d9dc;font-size:17px}.step input{width:22px;height:22px;accent-color:#4fae7b}.addrow{display:flex;gap:10px;margin-top:18px}.addrow input{flex:1;min-width:0;border:1px solid #b9c1c8;border-radius:13px;padding:12px 14px;font-size:16px}.addrow button,.primary{border:0;border-radius:13px;padding:12px 18px;background:#294d6c;color:#fff;font-weight:700;cursor:pointer}.hint{color:#687785;font-size:14px;margin-top:14px}@media(max-width:700px){.sheet{width:94vw;padding:20px}.head h2{font-size:24px}.addrow{flex-direction:column}}
</style></head><body>
<div class="app" aria-label="Tableau de bord Mes Projets">
<button class="hot h-stm" aria-label="Ouvrir Charli STM" data-id="stm"></button><button class="hot h-terrain" aria-label="Ouvrir Charli Terrain" data-id="terrain"></button><button class="hot h-livre" aria-label="Ouvrir Livre" data-id="livre"></button><button class="hot h-piano" aria-label="Ouvrir Piano" data-id="piano"></button><button class="hot h-later" aria-label="Ouvrir Plus tard" data-id="later"></button><button class="hot h-actions" aria-label="Voir les prochaines actions" data-id="actions"></button><button class="hot h-deadlines" aria-label="Voir les échéances" data-id="deadlines"></button>
</div><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const defaults={stm:{name:'Charli STM',icon:'🛠️',sub:'Finalisation et stabilité',date:'2026-10-31',steps:[['Finaliser la sauvegarde automatique',false],['Stabiliser STM Bureau',false],['Tester l’installation sur un second poste',false]]},terrain:{name:'Charli Terrain',icon:'📱',sub:'Version équipe et terrain',date:'2026-11-15',steps:[['Permettre aux chefs de choisir les agents',false],['Tester la synchronisation',false],['Valider la version terrain',false]]},livre:{name:'Livre',icon:'📖',sub:'Édition familiale pour Noël',date:'2026-12-15',steps:[['Finaliser les chapitres',false],['Faire la relecture complète',false],['Mise en page 11 × 17',false],['Commander un exemplaire test',false],['Lancer l’impression familiale',false]]},piano:{name:'Piano',icon:'🎵',sub:'Plaisir et progression',date:'',steps:[['Continuer la méthode Piano-Voix',false],['Travailler l’accompagnement d’une chanson',false]]},later:{name:'Plus tard',icon:'💡',sub:'Idées et projets en attente',date:'',steps:[['Application cétogène',false]]}};
let data=JSON.parse(localStorage.getItem('mes-projets-chaleureux')||'null')||defaults;const save=()=>localStorage.setItem('mes-projets-chaleureux',JSON.stringify(data));const pct=p=>p.steps.length?Math.round(p.steps.filter(x=>x[1]).length/p.steps.length*100):0;const fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}):'En continu';
function project(id){const p=data[id];sheet.innerHTML=`<div class="head"><div class="ico">${p.icon}</div><div><h2>${p.name}</h2><p>${p.sub}</p></div><button class="close" aria-label="Fermer">×</button></div><div class="meta"><span class="pill">📅 ${fmt(p.date)}</span><span class="pill">${pct(p)} % terminé</span></div><div class="progress"><i style="width:${pct(p)}%"></i></div><div class="steps">${p.steps.map((s,i)=>`<label class="step"><input type="checkbox" data-step="${i}" ${s[1]?'checked':''}><span>${s[0]}</span></label>`).join('')}</div><div class="addrow"><input id="newStep" placeholder="Ajouter une étape…"><button id="addStep">Ajouter</button></div><div class="hint">Les cases cochées et les nouvelles étapes sont enregistrées automatiquement sur cet ordinateur.</div>`;open();sheet.querySelector('.close').onclick=close;sheet.querySelectorAll('[data-step]').forEach(c=>c.onchange=()=>{p.steps[+c.dataset.step][1]=c.checked;save();project(id)});sheet.querySelector('#addStep').onclick=()=>{const v=sheet.querySelector('#newStep').value.trim();if(v){p.steps.push([v,false]);save();project(id)}}}
function summary(kind){let rows=[];Object.values(data).forEach(p=>{if(kind==='actions'){const s=p.steps.find(x=>!x[1]);if(s)rows.push(`<div class="step"><span>${p.icon}</span><b>${p.name}</b><span>— ${s[0]}</span></div>`)}else if(p.date){rows.push(`<div class="step"><span>${p.icon}</span><b>${p.name}</b><span>— ${fmt(p.date)}</span></div>`)}});sheet.innerHTML=`<div class="head"><div class="ico">${kind==='actions'?'🎯':'📅'}</div><div><h2>${kind==='actions'?'Mes prochaines actions':'Échéances à venir'}</h2><p>Vue synthétique de tes projets</p></div><button class="close">×</button></div><div class="steps">${rows.join('')}</div>`;open();sheet.querySelector('.close').onclick=close}
function open(){modal.classList.add('on')}function close(){modal.classList.remove('on')}document.querySelectorAll('.hot').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.id;id==='actions'||id==='deadlines'?summary(id):project(id)}));modal.addEventListener('click',e=>{if(e.target===modal)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
</script></body></html>
